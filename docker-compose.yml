services:
  # =====================
  # Django Application
  # =====================
  web:
    build: .

    container_name: sga_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=False
      - DATABASE_URL=postgres://sga_user:sga_password@db:5432/sga_db
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=SGA.settings
      - SYNC_CENTRAL_URL=${SYNC_CENTRAL_URL:-}
      - SYNC_AUTH_TOKEN=${SYNC_AUTH_TOKEN:-}
      - EMAIL_HOST=mail.bryzzafood.com
      - EMAIL_PORT=465
      - EMAIL_USE_TLS=False
      - EMAIL_USE_SSL=True
      - EMAIL_HOST_USER=sigap@bryzzafood.com
      - EMAIL_HOST_PASSWORD=@Sigap2026@
      - DEFAULT_FROM_EMAIL=SIGAP <sigap@bryzzafood.com>
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "python manage.py collectstatic --no-input && python manage.py migrate && gunicorn SGA.asgi:application --worker-class uvicorn.workers.UvicornWorker --workers 9 --bind 0.0.0.0:8000 --timeout 120 --keep-alive 5 --log-level info"

  # =====================
  # PostgreSQL Database
  # =====================
  db:
    image: postgres:16-alpine
    container_name: sga_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=sga_db
      - POSTGRES_USER=sga_user
      - POSTGRES_PASSWORD=sga_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sga_user -d sga_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # =====================
  # Redis (Channel Layer)
  # =====================
  redis:
    image: redis:7-alpine
    container_name: sga_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    # =====================
    # Cloudflare Tunnel (Removed)
    # =====================
    # tunnel:
    #   image: cloudflare/cloudflared
    #   restart: always
    #   depends_on:
    #     - web
    #   command: tunnel --url http://web:8000
    #   # O comando acima cria um link temporário (ex: https://random.trycloudflare.com)
    #   # que aponta direto para o seu Django na porta 8000.
    # =====================
  nginx:
    image: nginx:alpine
    container_name: sga_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web

  # =====================
  # Sync Daemon (Offline)
  # =====================
  sync_daemon:
    build: .
    container_name: sga_sync_daemon
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DEBUG=False
      - DATABASE_URL=postgres://sga_user:sga_password@db:5432/sga_db
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=SGA.settings
      - SYNC_CENTRAL_URL=${SYNC_CENTRAL_URL:-}
      - SYNC_AUTH_TOKEN=${SYNC_AUTH_TOKEN:-}
      - SYNC_INSTANCE_ID=sigap_local_v1
    volumes:
      - .:/app
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python manage.py sync_data --daemon

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
