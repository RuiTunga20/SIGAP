<form method="post" action="{% url 'editar_usuario' usuario.id %}" class="space-y-6">
    {% csrf_token %}
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="space-y-1.5">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-1">Primeiro Nome</label>
            {{ form.first_name }}
        </div>
        <div class="space-y-1.5">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-1">Sobrenome</label>
            {{ form.last_name }}
        </div>
    </div>

    <div class="space-y-1.5">
        <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-1">E-mail Corporativo</label>
        {{ form.email }}
    </div>

    <div class="space-y-1.5">
        <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-1">Telefone</label>
        {{ form.telefone }}
    </div>

    <div class="space-y-1.5">
        <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-1">Nível de Acesso</label>
        {{ form.nivel_acesso }}
    </div>

    <div class="space-y-4 pt-4 border-t border-slate-50">
        <div class="space-y-1.5">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-1">Departamento</label>
            {{ form.departamento }}
        </div>
        <div class="space-y-1.5">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-1">Secção (Opcional)</label>
            {{ form.seccao }}
        </div>
    </div>

    <div class="flex items-center gap-2 pt-4">
        {{ form.is_active }}
        <label for="{{ form.is_active.id_for_label }}" class="text-sm font-bold text-slate-700">Usuário Ativo</label>
    </div>

    <div class="flex justify-end gap-3 pt-6">
        <button type="button" onclick="closeModal()" class="px-6 py-3 bg-slate-100 text-slate-600 rounded-xl font-bold text-xs uppercase hover:bg-slate-200 transition-colors">
            Cancelar
        </button>
        <button type="submit" class="px-6 py-3 bg-sga-red text-white rounded-xl font-bold text-xs uppercase hover:bg-red-700 transition-colors shadow-lg shadow-red-200">
            Salvar Alterações
        </button>
    </div>
</form>

<script>
    // Re-inicializar Select2 e Lógica de Departamento/Secção dentro do modal
    $(document).ready(function() {
        $('#id_departamento_edit, #id_seccao_edit, #id_nivel_acesso').select2({
            dropdownParent: $('#modalContent'), // Importante para modal
            width: '100%'
        });

        // Lógica de Filtragem Dinâmica para Edição
        $('#id_departamento_edit').on('change', function() {
            const deptId = $(this).val();
            const seccaoSelect = $('#id_seccao_edit');
            
            seccaoSelect.empty().append('<option value="">Seleccione a Secção...</option>');
            
            if (deptId) {
                fetch(`/ajax/seccoes-departamento/?departamento_id=${deptId}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.seccao && data.seccao.length > 0) { // Nota: view retorna 'seccoes' ou 'seccao'? Verificar
                            // View original retorna 'seccoes'
                             data.seccoes.forEach(sec => {
                                seccaoSelect.append(new Option(sec.nome, sec.id, false, false));
                            });
                        }
                    });
            }
        });
    });
</script>
